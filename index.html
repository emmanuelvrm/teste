<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarefas Referência</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina">
    <header class="topo">
      <div>
        <h1>Tarefas Referênciaa</h1>
        <p class="sub">Projeto-modelo da disciplina de Administração de Sistemas Operacionais II</p>
      </div>
      <span class="etapa" id="etapa">Etapa 0: somente front</span>
    </header>

    <form id="form-nova" class="nova" autocomplete="off">
      <label for="titulo" class="sr">Nova tarefa</label>
      <input id="titulo" name="titulo" maxlength="120" placeholder="O que precisa ser feito?" required>
      <button type="submit">Adicionar</button>
    </form>

    <nav class="filtros" aria-label="Filtro de tarefas">
      <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
      <button type="button" data-filtro="pendentes" aria-pressed="false">Pendentes</button>
      <button type="button" data-filtro="concluidas" aria-pressed="false">Concluídas</button>
      <span class="contador" id="contador" aria-live="polite"></span>
    </nav>

    <ul id="lista" class="lista"></ul>
    <p id="vazio" class="vazio" hidden>Nenhuma tarefa aqui ainda.</p>

    <footer class="rodape">
      <span class="ponto" id="ponto"></span>
      <span id="status-servidor">Verificando servidor…</span>
      <span class="onde" id="onde"></span>
    </footer>
  </main>

  <!-- Cada arquivo tem UMA responsabilidade. A ordem importa. -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
